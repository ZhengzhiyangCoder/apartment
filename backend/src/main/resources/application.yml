spring:
  application:
    name: apartment
  profiles:
    default: local
  datasource:
    url: ${APARTMENT_DB_URL:jdbc:mysql://127.0.0.1:${APARTMENT_DB_PORT:3308}/apartment_demo?connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&sslMode=DISABLED}
    username: apartment_app
    password: ${APARTMENT_DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 26MB
  jackson:
    time-zone: Asia/Shanghai
    deserialization:
      accept-float-as-int: false
      fail-on-numbers-for-enums: true
server:
  address: 127.0.0.1
  port: ${APARTMENT_BACKEND_PORT:8081}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: APARTMENTSESSION
        path: /api
        http-only: true
        same-site: strict
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
apartment:
  storage:
    root: ${APARTMENT_STORAGE_ROOT:../.runtime/uploads/demo}
