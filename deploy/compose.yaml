name: apartment-local
services:
  mysql:
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    environment:
      MYSQL_ROOT_PASSWORD: ${APARTMENT_DB_ROOT_PASSWORD:?Run scripts/setup-local.sh first}
      MYSQL_DATABASE: apartment_demo
      MYSQL_USER: apartment_app
      MYSQL_PASSWORD: ${APARTMENT_DB_PASSWORD:?Run scripts/setup-local.sh first}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${APARTMENT_DB_PORT:-3308}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-test-database.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent 2>/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40
volumes:
  mysql-data:
