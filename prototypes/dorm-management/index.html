function hygiene(){if(isStudent()&&!state.studentRoom)return pageHead('HYGIENE / 卫生','卫生成绩','当前暂无住宿关系。')+`<section class="card">${empty('入住后即可查看','由管理员办理入住后，可查看寝室成绩和本楼栋排行。')}</section>`;let tabs=isStudent()?[['ranking','本楼栋排行'],['my-score','寝室成绩']]:[['batch','周检批次'],...(ui.role==='dorm'?[['score','连续评分']]:[]),['ranking','统计排行'],['rectify','整改跟进'],['scheme','评分标准']];if(!tabs.some(t=>t[0]===ui.tab))ui.tab=tabs[0][0];return pageHead('HYGIENE / 卫生检查',isStudent()?'每一分，都是共同的努力':'让检查有据，让改善可见',isStudent()?roomLabel(state.studentRoom)+' · 仅展示当前楼栋数据':'周度检查、连续录分与整改跟进，在这里有序完成。',isStudent()?'':btn('2026 年 · 第 46 周','batch-info','','calendar'))+`<div class="tabs" role="tablist" aria-label="卫生功能">${tabs.map(([id,name])=>`<button role="tab" aria-selected="${ui.tab===id}" class="tab ${ui.tab===id?'active':''}" data-tab="${id}">${name}</button>`).join('')}</div>`+(ui.tab==='batch'?batch():ui.tab==='score'?scorePage():ui.tab==='ranking'?ranking():ui.tab==='rectify'?rectify():ui.tab==='scheme'?scheme():myScore());}
function roomFilters(extra=''){return `<div class="filters">${isStudent()?pill(roomBy(state.studentRoom).building,'plain'):`<label><span class="sr-only">楼栋筛选</span><select id="building-filter">${options(buildings,ui.building)}</select></label>`}<label class="search">${icon('search')}<span class="sr-only">搜索寝室</span><input id="room-search" placeholder="搜索寝室号，如 104" value="${esc(ui.query)}"></label>${extra}</div>`;}
function batch(){let list=filteredRooms().filter(r=>r.expected!==false).filter(r=>ui.status==='all'||(ui.status==='done'?r.values:!r.values));let n=expectedRooms().filter(r=>r.values).length;return `<section class="card"><div class="card-head"><div><h2>第 46 周 · 日常卫生检查</h2><p class="caption">批次归属 2026-11-09 · 固定评分方案 V${state.scheme}</p></div><div class="row">${pill(state.batch,state.batch==='开放'?'success':'')}${isAdmin()?btn('批次管理','manage-batch','sm','calendar'):''}</div></div><div class="summary-strip"><div class="summary-pair"><small>应检寝室</small><strong>${expectedRooms().length}<span class="small muted"> 间</span></strong></div><div class="summary-pair"><small>已完成</small><strong>${n}<span class="small muted"> 间</span></strong></div><div class="summary-pair"><small>待检查</small><strong>${expectedRooms().length-n}<span class="small muted"> 间</span></strong></div><div style="width:28%"><div class="row between small muted"><span>完成率</span><span>${Math.round(n/expectedRooms().length*100)}%</span></div><div class="rail mt16"><span style="width:${n/expectedRooms().length*100}%"></span></div></div></div>${roomFilters(`<select id="score-status" aria-label="检查状态"><option value="all" ${ui.status==='all'?'selected':''}>全部检查状态</option><option value="todo" ${ui.status==='todo'?'selected':''}>待检查</option><option value="done" ${ui.status==='done'?'selected':''}>已检查</option></select>`)}${list.length?`<div class="table-wrap"><table><thead><tr><th>寝室</th><th>入住人数</th><th>检查状态</th><th>本周成绩</th><th>检查人</th><th>操作</th></tr></thead><tbody>${list.map(r=>`<tr><td>${r.building} · ${r.num}<small>${r.id}</small></td><td>${r.people} 人</td><td>${pill(r.values?'已检查':'待检查',r.values?'success':'pending')}</td><td><span class="${r.values?'score-num':''} ${score(r)!==null&&score(r)<60?'score-low':''}">${fmt(score(r))}</span></td><td>${r.values?'林沐':'—'}</td><td>${r.values?link('查看明细','score-detail',`data-room="${r.id}"`):ui.role==='dorm'?btn('开始评分','select-room','sm primary','',`data-room="${r.id}" ${state.batch!=='开放'?'disabled':''}`):'<span class="small muted">等待宿管录入</span>'}</td></tr>`).join('')}</tbody></table></div>`:empty()}<div class="footer-note"><span>共 ${list.length} 间寝室 · 未检查不计零分</span><span>应检名单按建批次时固定</span></div></section>`;}
function scorePage(){let rooms=filteredRooms().filter(r=>r.expected!==false&&!r.values);if(!rooms.some(r=>r.id===ui.room))ui.room=rooms[0]?.id;let r=roomBy(ui.room),draft=r&&state.drafts[r.id];return `<div class="score-layout"><section class="card score-side"><div class="card-head"><h2>待检查寝室</h2><span class="table-count">${rooms.length} 间</span></div><label class="field"><span>楼栋范围</span><select id="building-filter">${options(buildings,ui.building)}</select></label><div class="room-list">${rooms.map(x=>`<button class="room-button ${x.id===ui.room?'active':''}" data-action="select-room" data-room="${x.id}"><span>${x.building} · ${x.num}<small>${x.people} 人在住${state.drafts[x.id]?' · 有草稿':''}</small></span>${icon(x.id===ui.room?'chevron':'building')}</button>`).join('')||'<p class="muted small">当前范围已全部完成</p>'}</div><p class="small muted mt24">可跨楼栋连续检查。<br>正式保存后自动进入下一间。</p></section><section class="card">${r?`<div class="card-head"><div><div class="eyebrow">2026-W46 · 日常卫生检查 V${state.scheme}</div><h2>${r.building} · ${r.num} 寝室</h2></div>${pill(draft?'已恢复草稿':'待检查','pending')}</div><div class="note">每项输入 0–100 的整数。当前批次状态：${state.batch}。${draft?'已恢复本次演示中暂存的输入。':'分数填写完整后，可预览加权总分。'}</div><form id="score-form">${dimensions.map((d,i)=>`<label class="score-field"><span><h3>${d.name}<span class="small muted"> / 权重 ${d.weight}%</span></h3><p>${d.desc}</p></span><span><span class="sr-only">${d.name}分数</span><input type="number" name="score${i}" id="score${i}" min="0" max="100" step="1" placeholder="—" required value="${draft?esc(draft[i]):''}"></span></label>`).join('')}<div class="total-box"><div><h3>综合评分</h3><small>加权计算 · 低于 ${state.threshold} 分将触发整改</small></div><div><strong id="score-total" class="mono">—</strong><span class="muted"> 分</span></div></div><p class="error" id="score-error" role="alert"></p><div class="form-actions">${btn('暂存草稿','save-draft','','save')}<button class="btn primary" type="submit" ${state.batch!=='开放'?'disabled':''}>保存并下一间 ${icon('arrow')}</button></div></form>`:empty('本次检查已完成','当前筛选范围已没有待检查寝室。可切换楼栋，或查看统计排行。')}${!r?btn('查看统计排行','ranking','primary','chart'):''}</section></div>`;}
function periodScore(r){if(state.batch==='停检'&&ui.period==='week')return null;if(ui.period==='week')return score(r);let vals=[r.history[0],...(state.batch!=='停检'&&r.values?[score(r)]:[])].filter(n=>n!==null);return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*100)/100:null;}
function ranking(){let rooms=filteredRooms();let ranked=rooms.map(r=>({...r,periodScore:periodScore(r)})).filter(r=>r.periodScore!==null).sort((a,b)=>b.periodScore-a.periodScore||a.id.localeCompare(b.id));let last=null,rank=0;let rows=ranked.map((r,i)=>{if(r.periodScore!==last)rank=i+1;last=r.periodScore;return `<tr><td><span class="rank ${rank<=3?'top':''}">${rank}</span></td><td>${r.building} · ${r.num} ${r.id===state.studentRoom&&isStudent()?pill('我的寝室','plain'):''}</td><td class="score-num">${fmt(r.periodScore)}</td><td>${ui.period==='week'?1:(r.history[0]!==null?1:0)+(state.batch!=='停检'&&r.values?1:0)} 次</td><td>${isStudent()&&r.id!==state.studentRoom?'<span class="small muted">—</span>':link('成绩详情','score-detail',`data-room="${r.id}"`)}</td></tr>`;}).join('');let avg=ranked.length?ranked.reduce((a,r)=>a+r.periodScore,0)/ranked.length:null;
return `<section class="card"><div class="card-head"><div><h2>${isStudent()?roomBy(state.studentRoom).building:'寝室卫生'}排行榜</h2><p class="caption">${ui.period==='week'?'第 46 周 · 11.09 — 11.15':'2026 年 11 月 · 按批次周一归属月份'}</p></div><select id="period" aria-label="统计周期" style="width:auto"><option value="week" ${ui.period==='week'?'selected':''}>本周排行</option><option value="month" ${ui.period==='month'?'selected':''}>本月排行</option></select></div><div class="summary-strip"><div class="summary-pair"><small>有效参评寝室</small><strong>${ranked.length}<span class="small muted"> / ${rooms.length} 间</span></strong></div><div class="summary-pair"><small>寝室平均分</small><strong>${fmt(avg)}<span class="small muted"> 分</span></strong></div><div class="small muted">同分并列 · 竞赛排名<br>缺检不计入平均成绩</div></div>${roomFilters()}${rows?`<div class="table-wrap"><table><thead><tr><th>名次</th><th>寝室</th><th>周期成绩</th><th>有效参评</th><th>明细</th></tr></thead><tbody>${rows}</tbody></table></div>`:empty('暂无有效成绩','所选范围内没有可参与排名的正式成绩。')}<div class="footer-note"><span>共 ${ranked.length} 间参评 · 成绩保留两位小数</span><span>${isStudent()?'仅显示当前楼栋，不含个人信息':'统计口径：先计算寝室周期成绩，再求平均'}</span></div></section>${!isStudent()?`<div class="dashboard-grid mt32"><section class="card"><div class="card-head"><div><h2>楼栋成绩对比</h2><p class="caption">${ui.period==='week'?'本周':'本月'} · 对各楼栋有效寝室成绩取平均</p></div></div>${buildings.slice(1).map(b=>{let rs=rooms.filter(r=>r.building===b&&periodScore(r)!==null),v=rs.length?rs.reduce((a,r)=>a+periodScore(r),0)/rs.length:0;return `<div class="dimension"><span>${b}</span><div class="rail"><span style="width:${v}%"></span></div><span>${rs.length?v.toFixed(1):'—'}</span></div>`;}).join('')}</section><section class="card"><div class="card-head"><div><h2>维度表现</h2><p class="caption">第 46 周 · 同一评分标准 V${state.scheme}</p></div></div>${dimensions.map((d,i)=>{let rs=rooms.filter(r=>r.values&&state.batch!=='停检'),v=rs.length?rs.reduce((a,r)=>a+r.values[i],0)/rs.length:0;return `<div class="dimension"><span>${d.name}</span><div class="rail"><span style="width:${v}%"></span></div><span>${rs.length?v.toFixed(1):'—'}</span></div>`;}).join('')}</section></div>`:''}`;}
function myScore(){let r=roomBy(state.studentRoom);return `<div class="dashboard-grid"><section class="card"><div class="card-head"><div><h2>当前寝室成绩</h2><p class="caption">${roomLabel(r.id)} · 第 46 周</p></div>${pill(r.values?'已检查':'未检查',r.values?'success':'pending')}</div><div class="stat-value mono">${fmt(score(r))}<span class="stat-unit">分</span></div>${dimensions.map((d,i)=>`<div class="dimension"><span>${d.name} ${d.weight}%</span><div class="rail"><span style="width:${r.values?.[i]||0}%"></span></div><span>${r.values?.[i]??'—'}</span></div>`).join('')}<p class="small muted mt32">评分标准：日常卫生检查 V1 · 整改阈值 60 分</p></section><section class="card"><div class="card-head"><h2>最近 6 周趋势</h2></div>${trendChart([82.4,86.2,null,90.1,86.4,score(r)])}<p class="small muted">W43 未检查，折线留空。</p></section></div><section class="card mt32"><div class="card-head"><h2>历史成绩</h2></div><div class="table-wrap"><table><thead><tr><th>检查周期</th><th>检查日期</th><th>总分</th><th>评分标准</th><th>状态</th></tr></thead><tbody><tr><td>2026-W46</td><td>${r.values?'2026-11-11':'—'}</td><td>${fmt(score(r))}</td><td>日常卫生检查 V1</td><td>${pill(r.values?'已检查':'未检查',r.values?'success':'pending')}</td></tr><tr><td>2026-W45</td><td>2026-11-04</td><td>86.40</td><td>日常卫生检查 V1</td><td>${pill('已检查','success')}</td></tr></tbody></table></div></section>`;}
function rectify(){let list=state.rectifications.filter(x=>ui.status==='all'||(ui.status==='closed'?x.closed:!x.closed));return `<section class="card"><div class="card-head"><div><h2>低分整改跟进</h2><p class="caption">${state.rectifications.filter(x=>!x.closed).length} 间待核实 · 同寝室不重复生成未关闭事件</p></div><select id="rect-status" aria-label="整改状态" style="width:auto"><option value="all" ${ui.status==='all'?'selected':''}>全部整改</option><option value="open" ${ui.status==='open'?'selected':''}>待核实</option><option value="closed" ${ui.status==='closed'?'selected':''}>已关闭</option></select></div>${list.length?`<div class="table-wrap"><table><thead><tr><th>寝室</th><th>触发周次</th><th>当前成绩</th><th>状态</th><th>操作</th></tr></thead><tbody>${list.map((x)=>`<tr><td>${roomLabel(x.room)}${x.corrected?'<small>触发成绩已更正</small>':''}</td><td>2026-W46</td><td class="score-num ${score(roomBy(x.room))<60?'score-low':''}">${fmt(score(roomBy(x.room)))}</td><td>${pill(x.closed?'已关闭':'待核实',x.closed?'success':'alert')}</td><td>${link(x.closed?'查看记录':'跟进 / 核实','rect-detail',`data-room="${x.room}"`)}</td></tr>`).join('')}</tbody></table></div>`:empty('当前没有此状态的整改','所有跟进记录会保留在整改详情中。')}<div class="note mt24">单次成绩低于批次阈值时触发。后续成绩合格或成绩更正，不会自动关闭；核实后可填写说明关闭。</div></section>`;}
function scheme(){return `<section class="card"><div class="card-head"><div><h2>日常卫生检查标准</h2><p class="caption">当前批次绑定 V${state.scheme} · 新批次采用 V${state.enabledScheme}</p></div>${isAdmin()?btn('创建新版本','new-scheme','primary','plus'):pill('标准只读','plain')}</div><div class="summary-strip"><div class="summary-pair"><small>维度数量</small><strong>3<span class="small muted"> 项</span></strong></div><div class="summary-pair"><small>权重合计</small><strong>100<span class="small muted"> %</span></strong></div><div class="summary-pair"><small>本批次整改阈值</small><strong>${state.threshold}<span class="small muted"> 分</span></strong></div></div><div class="table-wrap"><table><thead><tr><th>评分维度</th><th>检查要点</th><th>权重</th><th>取值范围</th></tr></thead><tbody>${dimensions.map(d=>`<tr><td>${d.name}</td><td>${d.desc}</td><td>${d.weight}%</td><td>0–100 整数</td></tr>`).join('')}</tbody></table></div><div class="note mt32">已使用的方案保持不变。调整标准将创建新版本，仅影响之后创建的批次；历史成绩继续保留原有评分依据。</div>${state.enabledScheme>1?`<div class="mt24">${pill('新版本 V'+state.enabledScheme+' 已启用','success')}<p class="small muted mt16">${state.newDimensions.map(d=>esc(d.name)+' '+d.weight+'%').join(' · ')}。阈值 ${state.newThreshold} 分；当前第 46 周仍使用 V1。</p></div>`:''}</section>`;}
const repairStatuses=['待分配','待处理','处理中','已完成','已取消'];
function repairTable(rs,compact=false){if(!rs.length)return empty('暂无工单','当前筛选范围内没有报修记录。');return `<div class="table-wrap"><table><thead><tr><th>报修问题</th><th>寝室位置</th><th>状态</th>${compact?'':'<th>维修人员</th>'}<th>提交时间</th><th>操作</th></tr></thead><tbody>${rs.map(r=>`<tr><td><div class="repair-title">${esc(r.title)}</div><small>${r.id}</small></td><td>${roomLabel(r.room)}</td><td>${pill(repairStatuses[r.status],r.status===3?'success':r.status<3?'pending':'')}</td>${compact?'':`<td>${esc(r.assignee)||'待分配'}</td>`}<td class="small muted">${r.time}</td><td>${r.status===0&&isManager()?btn('派单','repair-detail','sm primary','',`data-id="${r.id}"`):link(ui.role==='maintainer'&&r.status===1?'开始处理':'查看详情','repair-detail',`data-id="${r.id}"`)}</td></tr>`).join('')}</tbody></table></div>`;}
function repairs(){let rs=visibleRepairs(),counts=repairStatuses.map((_,i)=>rs.filter(r=>r.status===i).length);rs=rs.filter(r=>(ui.status==='all'||r.status===Number(ui.status))&&(!ui.query||(r.title+r.id+roomLabel(r.room)).includes(ui.query)));return pageHead('REPAIRS / 报修服务',isStudent()?'寝室有问题，随时告诉我们':ui.role==='maintainer'?'把每一件小事，认真修好':'让报修及时响应，让处理有迹可循',isStudent()?'提交维修需求，随时查看处理进度。':ui.role==='maintainer'?'这里只展示分配给你的维修任务。':'查看问题、安排人员、追踪每一张工单。',isStudent()?btn('新建报修','new-repair','primary','plus',!state.studentRoom?'disabled':''):'')+`<section class="card"><div class="tabs" role="tablist" aria-label="工单状态"><button class="tab ${ui.status==='all'?'active':''}" role="tab" aria-selected="${ui.status==='all'}" data-repair-status="all">全部 ${visibleRepairs().length}</button>${repairStatuses.map((s,i)=>`<button class="tab ${ui.status===String(i)?'active':''}" role="tab" aria-selected="${ui.status===String(i)}" data-repair-status="${i}">${s} ${counts[i]}</button>`).join('')}</div><div class="filters"><label class="search">${icon('search')}<span class="sr-only">搜索报修</span><input id="repair-search" placeholder="搜索问题、工单号或寝室" value="${esc(ui.query)}"></label><span class="table-count">${isStudent()?'仅本人提交':ui.role==='maintainer'?'仅本人负责':'全部楼栋'} · ${rs.length} 条记录</span></div>${repairTable(rs)}<div class="footer-note"><span>待分配 → 待处理 → 处理中 → 已完成</span><span>维修开始前可取消，取消需说明原因</span></div></section>`;}
function residence(){if(isStudent())return studentResidence();let tabs=[['rooms','楼栋与寝室'],['students','学生与入住'],...(isAdmin()?[['accounts','账号管理'],['audit','操作记录']]:[])];if(!tabs.some(t=>t[0]===ui.housingTab))ui.housingTab='rooms';return pageHead('RESIDENCE / 住宿管理','每一间寝室，都井然有序',isAdmin()?'维护住宿资料，管理入住、调寝与退宿。':'查看楼栋、寝室与学生住宿信息。',isAdmin()?btn(ui.housingTab==='accounts'?'创建账号':'新增寝室',ui.housingTab==='accounts'?'new-account':'new-room','primary','plus'):'')+`<div class="tabs" role="tablist" aria-label="住宿功能">${tabs.map(([id,name])=>`<button class="tab ${ui.housingTab===id?'active':''}" role="tab" aria-selected="${ui.housingTab===id}" data-housing-tab="${id}">${name}</button>`).join('')}</div>`+(ui.housingTab==='rooms'?roomGrid():ui.housingTab==='students'?studentList():ui.housingTab==='accounts'?accountList():auditList());}
function roomGrid(){let rs=filteredRooms();return roomFilters()+`<div class="room-grid">${rs.map(r=>`<section class="card room-card"><div class="row between"><span class="small muted">${r.building}</span>${pill(r.people===4?'已住满':'有空床',r.people===4?'':'success')}</div><div class="room-number mono">${r.num}<span class="small muted"> / 四人间</span></div><p class="small muted">${r.building.startsWith('知行')?'知行园区':'明德园区'} · ${r.num[0]} 层</p><div class="bed-icons" aria-label="${r.people} 人入住，${4-r.people} 个空床">${[1,2,3,4].map(n=>`<span class="bed-icon ${n>r.people?'free':''}">${icon('bed')}</span>`).join('')}</div><div class="row between"><span class="small muted">${r.people} / 4 人入住</span>${link('寝室详情','room-detail',`data-room="${r.id}"`)}</div></section>`).join('')}</div>${rs.length?'':`<section class="card">${empty()}</section>`}`;}
function studentList(){return `<section class="card"><div class="card-head"><div><h2>学生住宿信息</h2><p class="caption">演示名册 · 当前住宿与历史变更</p></div></div><div class="table-wrap"><table><thead><tr><th>学生</th><th>学院</th><th>当前寝室</th><th>床位</th><th>状态</th><th>操作</th></tr></thead><tbody>${state.students.map(s=>`<tr><td>${esc(s.name)}<small>${esc(s.id)}</small></td><td>${esc(s.college)}</td><td>${s.room?roomLabel(s.room):'—'}</td><td>${s.bed||'—'}</td><td>${pill(s.room?'在住':'未入住',s.room?'success':'')}</td><td>${link(isAdmin()?(s.room?'调寝 / 退宿':'办理入住'):'查看资料','student-detail',`data-id="${s.id}"`)}</td></tr>`).join('')}</tbody></table></div><p class="small muted mt24">共 ${state.students.length} 位演示学生 · 床位分配与历史信息联动展示</p></section>`;}
function accountList(){return `<section class="card"><div class="card-head"><h2>系统账号</h2><span class="small muted">账号由管理员创建，不开放注册</span></div><div class="table-wrap"><table><thead><tr><th>姓名 / 账号</th><th>角色</th><th>账号状态</th><th>操作</th></tr></thead><tbody>${state.accounts.map((a,i)=>`<tr><td>${esc(a.name)}<small>${esc(a.id)}</small></td><td>${a.role}</td><td>${pill(a.enabled?'已启用':'已禁用',a.enabled?'success':'')}</td><td>${link('管理账号','account-detail',`data-index="${i}"`)}</td></tr>`).join('')}</tbody></table></div></section>`;}
function auditList(){return `<section class="card"><div class="card-head"><h2>关键操作记录</h2><span class="small muted">本次演示会话</span></div>${state.audit.length?`<div class="table-wrap"><table><thead><tr><th>操作时间</th><th>操作人</th><th>事项</th><th>原因 / 变更</th></tr></thead><tbody>${state.audit.map(x=>`<tr><td>${x.time}</td><td>${x.by}</td><td>${esc(x.action)}</td><td style="white-space:normal">${esc(x.detail)}</td></tr>`).join('')}</tbody></table></div>`:empty('暂无操作记录','尝试派单、提交评分或办理调寝后，可在此查看记录。')}</section>`;}
function studentResidence(){let r=roomBy(state.studentRoom),s=state.students[0];return pageHead('MY RESIDENCE / 我的住宿','熟悉的寝室，安心的日常','查看自己的住宿位置与入住信息。')+`<section class="card">${r?`<div class="my-room"><div class="room-medallion">${icon('building')}</div><div><div class="eyebrow">${r.building.startsWith('知行')?'知行园区':'明德园区'}</div><h1>${r.building} · ${r.num}</h1><p class="subtitle">${r.num[0]} 层 · 四人间 · ${s.bed} 号床</p></div><div style="margin-left:auto">${pill('当前在住','success')}</div></div><div class="profile-meta"><div><small>姓名</small>许知远</div><div><small>学号</small>2024001001</div><div><small>学院</small>计算机学院</div></div><div class="mt32 row">${btn('查看寝室卫生','my-scores','primary','clipboard')}${btn('提交寝室报修','new-repair','','tool')}</div>`:empty('你还没有入住寝室','请联系系统管理员办理入住。历史报修仍可在「我的报修」查看。')}</section><section class="card mt32"><div class="card-head"><h2>住宿变更记录</h2></div><div class="timeline">${state.residenceHistory.filter(x=>x.student===s.id).map(x=>`<div class="timeline-item"><span class="timeline-node"></span><div><small>${x.time}</small><p>${esc(x.text)}</p></div></div>`).join('')}<div class="timeline-item"><span class="timeline-node"></span><div><small>2024-09-01</small><p>办理入住 · 知行 1 栋 104 寝室 · 04 号床</p></div></div></div></section>`;}
let toastTimer,modalSubmit,restoreFocus;
function toast(message){clearTimeout(toastTimer);$('#toast').innerHTML=icon('check')+'<span>'+esc(message)+'</span>';$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,4200);}
const now=()=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());
function audit(action,detail){state.audit.unshift({time:'11-11 '+now(),by:roles[ui.role].name,action,detail});}
function showModal(title,sub,content,onSubmit){restoreFocus=document.activeElement;let d=$('#modal');d.innerHTML=`<div class="modal-head"><div><h2 id="modal-title">${title}</h2><p class="muted small">${sub}</p></div><button class="close" data-action="close-modal" aria-label="关闭对话框">${icon('close')}</button></div>${content}`;modalSubmit=onSubmit;if(!d.open)d.showModal();}
function closeModal(){if($('#modal').open)$('#modal').close();modalSubmit=null;restoreFocus?.focus?.();}
function formFooter(label='保存',danger=false){return `<p class="error" id="modal-error" role="alert"></p><div class="modal-actions">${btn('取消','close-modal')}<button type="submit" class="btn ${danger?'danger':'primary'}">${label}</button></div>`;}
const field=(name,label,placeholder='',value='',type='text',attrs='')=>`<label class="field"><span>${label}</span><input name="${name}" type="${type}" placeholder="${placeholder}" value="${esc(value)}" ${attrs}></label>`;
const textarea=(name,label,placeholder='',required=true)=>`<label class="field"><span>${label}</span><textarea name="${name}" placeholder="${placeholder}" ${required?'required':''} maxlength="500"></textarea></label>`;
function modalError(s){let el=$('#modal-error');if(el)el.textContent=s;}
function submitModal(e){if(e.target.id!=='dialog-form')return;e.preventDefault();if(e.target.reportValidity()&&modalSubmit)modalSubmit(new FormData(e.target),e.target);}
document.addEventListener('submit',submitModal);
function bindScore(){let f=$('#score-form');if(!f)return;const update=()=>{let raw=[0,1,2].map(i=>$('#score'+i).value);$('#score-total').textContent=raw.every(v=>v!==''&&Number(v)>=0&&Number(v)<=100&&Number.isInteger(Number(v)))?fmt(total(raw)):'—';};f.addEventListener('input',update);f.addEventListener('submit',e=>{e.preventDefault();let raw=[0,1,2].map(i=>$('#score'+i).value),r=roomBy(ui.room);if(state.batch!=='开放'){return $('#score-error').textContent='批次已关闭或停检，无法提交。输入已保留。';}if(!r||r.values){return $('#score-error').textContent='该寝室已有正式成绩，请重新核对。输入已保留。';}if(!f.reportValidity())return;r.values=raw.map(Number);delete state.drafts[r.id];if(score(r)<state.threshold&&!state.rectifications.some(x=>x.room===r.id&&!x.closed))state.rectifications.push({room:r.id,closed:false,notes:[],corrected:false});audit('提交卫生评分',roomLabel(r.id)+' · '+fmt(score(r))+' 分');let label=roomLabel(r.id);render();toast(label+' 已保存，已进入下一间待检寝室');});update();}
function saveDraft(){let r=roomBy(ui.room);if(!r)return;state.drafts[r.id]=[0,1,2].map(i=>$('#score'+i).value);toast('草稿已暂存，可切换页面后恢复');}
function detailScore(id){let r=roomBy(id);if(!r)return;if(isStudent()&&id!==state.studentRoom)return;showModal(roomLabel(id)+' · 评分明细','2026-W46 · 日常卫生检查 V1',`<div class="total-box"><div><h3>综合评分</h3><small>${r.values?'录入人 林沐 · 2026-11-11':'当前周期尚未检查'}</small></div><strong>${fmt(score(r))}</strong></div>${dimensions.map((d,i)=>`<div class="row between mt24"><span>${d.name} <span class="small muted">${d.weight}%</span></span><span class="score-num">${r.values?.[i]??'—'}</span></div>`).join('')}${r.correction?`<div class="note mt24">更正记录：${esc(r.correction)}</div>`:''}<div class="modal-actions">${btn('关闭','close-modal')}${isAdmin()&&r.values?btn('更正成绩','correct-score','primary','',`data-room="${id}"`):''}</div>`);}
function correctScore(id){if(!isAdmin())return;let r=roomBy(id),old=fmt(score(r));showModal('更正正式成绩',roomLabel(id)+' · 原成绩 '+old+' 分',`<form id="dialog-form"><div class="form-grid">${dimensions.map((d,i)=>field('v'+i,d.name+'（'+d.weight+'%）','',r.values[i],'number','min="0" max="100" step="1" required')).join('')}<div class="full">${textarea('reason','更正原因','请说明原记录错误及核实依据')}</div></div><div class="note mt24">保留原分值及更正记录，当前排行将使用更正后的成绩。整改事件不会自动删除。</div>${formFooter('确认更正')}</form>`,fd=>{let oldValues=[...r.values],reason=fd.get('reason').trim();if(!reason)return modalError('请填写更正原因。');r.values=[0,1,2].map(i=>Number(fd.get('v'+i)));r.correction=`${old} → ${fmt(score(r))}；${reason}；陈老师，11-11 ${now()}`;let rect=state.rectifications.find(x=>x.room===id&&!x.closed);if(score(r)<60&&!rect)state.rectifications.push({room:id,closed:false,notes:[],corrected:false});if(score(r)>=60&&rect)rect.corrected=true;audit('更正卫生成绩',roomLabel(id)+'：'+oldValues.join('/')+' → '+r.values.join('/')+'；'+reason);closeModal();render();toast('成绩已更正，旧值与原因已记录');});}
function detailRect(id){let x=state.rectifications.find(r=>r.room===id);if(!x||!isManager())return;showModal('整改跟进 · '+roomLabel(id),`第 46 周 · 当前成绩 ${fmt(score(roomBy(id)))} 分`,`${x.corrected?'<div class="note">触发成绩已更正，请核实后决定是否关闭整改。</div>':''}<div class="timeline"><div class="timeline-item"><span class="timeline-node"></span><div><small>11-11 · 自动触发</small><p>卫生综合成绩低于本批次阈值 60 分。</p></div></div>${x.notes.map(n=>`<div class="timeline-item"><span class="timeline-node"></span><div><small>${n.time}</small><p>${esc(n.text)}</p></div></div>`).join('')}</div>${x.closed?'<div class="note mt24">该整改已核实关闭，历史记录保留。</div>':`<form id="dialog-form" class="mt32">${textarea('note','跟进 / 核实说明','填写复查情况或需要继续改进的事项')}<label class="field mt24"><span>本次处理</span><select name="result"><option value="follow">添加跟进，保持待核实</option><option value="close">核实完成，关闭整改</option></select></label>${formFooter('保存处理结果')}</form>`}`,fd=>{let text=fd.get('note').trim();if(!text)return modalError('请填写跟进或核实说明。');x.closed=fd.get('result')==='close';x.notes.push({text:(x.closed?'核实关闭：':'跟进：')+text,time:'11-11 '+now()});audit(x.closed?'关闭整改':'跟进整改',roomLabel(id)+'；'+text);closeModal();render();toast(x.closed?'整改已核实关闭':'跟进记录已保存');});}
function detailRepair(id){let r=visibleRepairs().find(x=>x.id===id);if(!r)return;let manager=isManager(),worker=ui.role==='maintainer',student=isStudent();let actions='';if(manager&&r.status<2)actions+=btn(r.status===0?'分配维修人员':'重新分配','assign-repair','primary','',`data-id="${id}"`);if(worker&&r.status===1)actions+=btn('开始维修','start-repair','primary','tool',`data-id="${id}"`);if(worker&&r.status===2)actions+=btn('填写完成说明','finish-repair','primary','check',`data-id="${id}"`);if((student||manager)&&r.status<2)actions+=btn('取消工单','cancel-repair','','',`data-id="${id}"`);showModal(esc(r.title),r.id+' · '+roomLabel(r.room),`<div class="row between">${pill(repairStatuses[r.status],r.status===3?'success':'pending')}<span class="small muted">${esc(r.type)} · 提交于 ${r.time}</span></div>${r.status!==4?`<div class="stepper">${repairStatuses.slice(0,4).map((s,i)=>`<div class="step ${i<=r.status?'done':''}"><div class="step-marker">${i<r.status?icon('check'):i+1}</div>${s}</div>`).join('')}</div>`:''}<div class="note mt24">${esc(r.desc)}</div>${r.images.length?`<div class="previews">${r.images.map(src=>`<a href="${src}" target="_blank" rel="noopener"><img src="${src}" alt="报修现场图片"></a>`).join('')}</div>`:''}<div class="profile-meta"><div><small>报修人</small>${esc(r.owner)}</div><div><small>维修人员</small>${esc(r.assignee)||'待分配'}</div><div><small>问题类型</small>${esc(r.type)}</div></div><h3 class="mt32">处理记录</h3><div class="timeline">${[...r.logs].reverse().map(l=>`<div class="timeline-item"><span class="timeline-node"></span><div><small>${l.time} · ${esc(l.by)}</small><p>${esc(l.text)}</p></div></div>`).join('')}</div><div class="modal-actions wrap">${actions||btn('关闭','close-modal')}</div>`);}
let pendingImages=[];
function newRepair(){if(!isStudent()||!state.studentRoom)return;pendingImages=[];showModal('提交寝室报修','当前位置：'+roomLabel(state.studentRoom),`<form id="dialog-form"><div class="stack"><label class="field"><span>问题类型</span><select name="type">${options(['水电设施','照明设施','门窗家具','其他设施'])}</select></label>${field('title','问题标题','例如：洗手池下水管漏水','','text','required maxlength="40"')}${textarea('desc','问题描述','请描述故障现象与具体位置，方便维修人员判断。')}<div class="upload">${icon('image')}<label for="repair-images">现场图片（选填） · JPG / PNG / WebP<br>最多 5 张，每张不超过 5 MB</label><input type="file" id="repair-images" accept="image/jpeg,image/png,image/webp" multiple><div class="previews" id="image-previews"></div></div></div>${formFooter('提交报修')}</form>`,fd=>{let title=fd.get('title').trim(),desc=fd.get('desc').trim();if(!title||!desc)return modalError('请填写问题标题与描述。');if(pendingImages.some(x=>!x))return modalError('图片仍在读取，请稍后再提交。');let r={id:'WX-20261111-'+String(state.repairs.length+1).padStart(3,'0'),title,type:fd.get('type'),room:state.studentRoom,owner:'许知远',status:0,assignee:'',desc,time:'11-11 '+now(),images:[...pendingImages],logs:[{text:'报修已提交，等待分配维修人员',by:'许知远',time:'11-11 '+now()}]};state.repairs.unshift(r);audit('提交报修',r.id+'；'+title);closeModal();navigate('repairs');toast('报修已提交，可切换宿舍管理员继续派单');});}
function assignRepair(id){if(!isManager())return;let r=state.repairs.find(x=>x.id===id);if(!r||r.status>1)return;showModal(r.status===0?'分配维修人员':'重新分配维修人员',r.title+' · '+roomLabel(r.room),`<form id="dialog-form"><label class="field"><span>维修人员</span><select name="assignee">${options(['周师傅','李师傅'],r.assignee||'周师傅')}</select></label><div class="mt24">${textarea('reason',r.status===0?'派单备注（选填）':'重新分配原因','填写安排说明',r.status===1)}</div>${formFooter('确认派单')}</form>`,fd=>{let reason=fd.get('reason').trim();if(r.status===1&&!reason)return modalError('重新分配必须填写原因。');r.status=1;r.assignee=fd.get('assignee');r.logs.push({text:'已分配给 '+r.assignee+(reason?'；'+reason:''),by:roles[ui.role].name,time:'11-11 '+now()});audit('分配报修',r.id+' → '+r.assignee+'；'+reason);closeModal();render();toast('派单成功，维修人员可查看任务');});}
function changeRepair(id,action){let r=visibleRepairs().find(x=>x.id===id);if(!r)return;if(action==='start-repair'){if(ui.role!=='maintainer'||r.status!==1)return;r.status=2;r.logs.push({text:'已开始维修',by:'周师傅',time:'11-11 '+now()});audit('开始维修',id);closeModal();render();toast('工单已进入处理中');return;}let finish=action==='finish-repair';if(finish&&(ui.role!=='maintainer'||r.status!==2))return;if(!finish&&(!isManager()&&!isStudent()||r.status>1))return;showModal(finish?'完成维修':'取消工单',r.title,`<form id="dialog-form">${textarea('note',finish?'维修完成说明':'取消原因',finish?'描述维修措施及检查结果':'请说明取消本次报修的原因')}<p class="small muted mt16">${finish?'保存后，学生将看到处理结果。':'取消后工单保留历史记录，不可重新打开。'}</p>${formFooter(finish?'确认完成':'确认取消',!finish)}</form>`,fd=>{let note=fd.get('note').trim();if(!note)return modalError('请填写说明。');r.status=finish?3:4;r.logs.push({text:(finish?'维修完成：':'工单取消：')+note,by:roles[ui.role].name,time:'11-11 '+now()});audit(finish?'完成维修':'取消工单',id+'；'+note);closeModal();render();toast(finish?'维修已完成，处理记录已更新':'工单已取消');});}
function initBeds(){state.rooms.forEach(r=>r.beds=Array.from({length:4},(_,i)=>i<r.people?'演示住户':null));state.students.filter(s=>s.room).forEach(s=>roomBy(s.room).beds[Number(s.bed)-1]=s.id);}
initBeds();
function detailRoom(id){let r=roomBy(id);showModal(roomLabel(id)+' · 寝室详情',r.num[0]+' 层 · 四人间',`<div class="summary-strip"><div class="summary-pair"><small>在住人数</small><strong>${r.people} 人</strong></div><div class="summary-pair"><small>空余床位</small><strong>${4-r.people} 个</strong></div><div class="summary-pair"><small>本周成绩</small><strong>${fmt(score(r))}</strong></div></div><div class="stack">${r.beds.map((v,i)=>`<div class="row between"><span class="row">${icon('bed')} ${String(i+1).padStart(2,'0')} 号床</span><span class="muted">${v?state.students.find(s=>s.id===v)?.name||'演示住户':'空床'}</span>${pill(v?'在住':'可分配',v?'':'success')}</div>`).join('')}</div><div class="modal-actions">${btn('关闭','close-modal')}${isAdmin()?btn('办理住宿','goto-students','primary','users'):''}</div>`);}
function detailStudent(id){let s=state.students.find(x=>x.id===id);if(!s)return;let free=state.rooms.flatMap(r=>r.beds.map((v,i)=>v?null:{value:r.id+':'+(i+1),label:roomLabel(r.id)+' · '+String(i+1).padStart(2,'0')+' 号床'}).filter(Boolean));if(!isAdmin()){showModal(esc(s.name)+' · 学生资料',s.id,`<div class="stack"><p>学院：${esc(s.college)}</p><p>当前住宿：${s.room?roomLabel(s.room)+' · '+s.bed+' 号床':'未入住'}</p><div class="note">宿舍管理员可查看工作所需住宿信息，修改由系统管理员办理。</div></div>`);return;}showModal(s.room?'调寝 / 退宿':'办理入住',esc(s.name)+' · '+s.id+' · 当前 '+(s.room?roomLabel(s.room):'未入住'),`<form id="dialog-form"><label class="field"><span>目标空床位${s.room?'或退宿':''}</span><select name="target" required><option value="">请选择</option>${s.room?'<option value="checkout">办理退宿（不分配新床位）</option>':''}${free.map(o=>`<option value="${o.value}">${o.label}</option>`).join('')}</select></label><div class="mt24">${textarea('reason','办理原因','填写住宿调整原因')}</div><div class="note mt24">调寝后卫生成绩与排行范围随新寝室变化。本人历史报修继续保留原提交位置。</div>${formFooter('确认办理')}</form>`,fd=>{let reason=fd.get('reason').trim();if(!reason)return modalError('请填写办理原因。');let old=s.room,target=fd.get('target'),newRoom=null,newBed=null;if(target!=='checkout'){let [rid,bed]=target.split(':');let r=roomBy(rid);if(r.beds[Number(bed)-1])return modalError('所选床位已被占用，请重新选择。');newRoom=rid;newBed=String(bed).padStart(2,'0');r.beds[Number(bed)-1]=s.id;r.people=r.beds.filter(Boolean).length;}if(old){let r=roomBy(old);r.beds[Number(s.bed)-1]=null;r.people=r.beds.filter(Boolean).length;}s.room=newRoom;s.bed=newBed;if(id==='2024001001')state.studentRoom=newRoom;let text=(old?roomLabel(old):'未入住')+' → '+(newRoom?roomLabel(newRoom)+' '+newBed+' 号床':'已退宿')+'；'+reason;state.residenceHistory.unshift({student:id,text,time:'11-11 '+now()});audit('住宿变更',s.name+'；'+text);closeModal();render();toast('住宿变更已保存，历史记录已保留');});}
function newRoom(){if(!isAdmin())return;showModal('新增寝室','创建住宿资料；不自动加入已固定的本周应检名单',`<form id="dialog-form"><div class="form-grid"><label class="field"><span>所属楼栋</span><select name="building">${options(buildings.slice(1))}</select></label>${field('num','寝室号','例如 105','','text','required pattern="[0-9]{3}" maxlength="3"')}</div><div class="note mt24">新建寝室默认为四人间，初始床位为空置。创建后可在「学生与入住」中分配空床。</div>${formFooter('创建寝室')}</form>`,fd=>{let building=fd.get('building'),num=fd.get('num');if(state.rooms.some(r=>r.building===building&&r.num===num))return modalError('该楼栋的寝室号已存在。');let id=['A','B','C'][buildings.indexOf(building)-1]+num;state.rooms.push({id,building,num,people:0,values:null,history:[null,null],beds:[null,null,null,null],expected:false});audit('新增寝室',roomLabel(id));closeModal();render();toast('寝室已创建，尚未纳入本周应检名单');});}
function newAccount(){if(!isAdmin())return;showModal('创建系统账号','一个账号对应一种角色',`<form id="dialog-form"><div class="form-grid">${field('name','姓名','输入演示姓名','','text','required maxlength="20"')}${field('id','账号','学号或工作账号','','text','required minlength="4" maxlength="32"')}<label class="field"><span>角色</span><select name="role">${options(Object.values(roles).map(r=>r.label),'学生')}</select></label>${field('password','初始密码','至少 8 位','','password','required minlength="8" autocomplete="new-password"')}</div>${formFooter('创建账号')}</form>`,fd=>{if(state.accounts.some(a=>a.id===fd.get('id')))return modalError('账号已存在。');state.accounts.push({name:fd.get('name').trim(),id:fd.get('id').trim(),role:fd.get('role'),enabled:true});audit('创建账号',fd.get('id')+'；'+fd.get('role'));closeModal();render();toast('演示账号已创建；原型不保存密码');});}
function detailAccount(index){if(!isAdmin())return;let a=state.accounts[index];showModal('管理账号',esc(a.name)+' · '+esc(a.id),`<form id="dialog-form"><div class="stack"><label class="field"><span>角色</span><select name="role">${options(Object.values(roles).map(r=>r.label),a.role)}</select></label><label class="field"><span>账号状态</span><select name="enabled"><option value="true" ${a.enabled?'selected':''}>启用</option><option value="false" ${!a.enabled?'selected':''}>禁用</option></select></label>${field('password','重置密码（选填）','至少 8 位','','password','minlength="8" autocomplete="new-password"')}</div><p class="small muted mt24">此处展示账号管理交互；顶部角色切换是原型审阅入口。</p>${formFooter('保存账号设置')}</form>`,fd=>{a.role=fd.get('role');a.enabled=fd.get('enabled')==='true';audit('修改账号',a.id+'；'+a.role+'；'+(a.enabled?'启用':'禁用')+(fd.get('password')?'；重置密码':''));closeModal();render();toast('账号设置已保存，原型不保存密码');});}
function manageBatch(){if(!isAdmin())return;showModal('管理本周检查批次','2026-W46 · 完成率与管理状态独立',`<form id="dialog-form"><label class="field"><span>批次状态</span><select name="status">${options(['开放','关闭','停检'],state.batch)}</select></label><div class="mt24">${textarea('reason','调整原因','说明关闭、停检或恢复批次的原因')}</div><div class="note mt24">关闭后不可普通录分。停检保留历史记录，同时从有效排行中排除。本原型演示当前周状态调整。</div>${formFooter('确认调整')}</form>`,fd=>{let reason=fd.get('reason').trim();if(!reason)return modalError('请填写调整原因。');let old=state.batch;state.batch=fd.get('status');audit('调整批次状态',old+' → '+state.batch+'；'+reason);closeModal();render();toast('批次状态已更新');});}
function newScheme(){if(!isAdmin())return;showModal('创建评分标准新版本','当前批次保持原标准，新版本用于之后创建的批次',`<form id="dialog-form"><div class="form-grid">${dimensions.map((d,i)=>field("name"+i,"维度名称", "",d.name,"text","required maxlength=20")+field("weight"+i,"权重（%）","",d.weight,"number","required min=0 max=100 step=0.01")).join('')}</div><div class="note mt24">权重合计必须为 100%。本周已创建的批次继续使用原评分标准。</div><div class="mt24">${field('threshold','新版本整改阈值','',60,'number','min="0" max="100" step="0.01" required')}</div><div class="mt24">${textarea('reason','版本说明','说明本次调整的原因')}</div>${formFooter('创建并用于新批次')}</form>`,fd=>{let weights=[0,1,2].map(i=>Number(fd.get("weight"+i)));if(Math.abs(weights.reduce((a,b)=>a+b,0)-100)>0.00001)return modalError("各维度权重合计必须为 100%。");let names=[0,1,2].map(i=>fd.get("name"+i).trim());if(names.some(x=>!x)||new Set(names).size!==3)return modalError("维度名称不能为空或重复。");state.newDimensions=names.map((name,i)=>({name,weight:weights[i]}));state.enabledScheme++;state.newThreshold=Number(fd.get('threshold'));audit('创建评分方案版本','V'+state.enabledScheme+'；阈值 '+state.newThreshold+'；'+fd.get('reason'));closeModal();render();toast('新版本已启用，当前批次仍使用原标准');});}
function profile(){let r=roles[ui.role];showModal('个人资料',r.label,`<div class="my-room"><span class="avatar" style="display:grid;place-items:center">${r.avatar}</span><div><h2>${r.name}</h2><p class="muted small">${r.caption}</p></div></div><div class="modal-actions">${btn('退出登录','logout','','logout')}${btn('修改密码','password','primary','shield')}</div>`);}
function password(){showModal('修改密码','仅用于预览表单校验，原型不保存密码',`<form id="dialog-form"><div class="stack">${field('old','当前密码','','','password','required autocomplete="current-password"')}${field('new','新密码','至少 8 位','','password','required minlength="8" autocomplete="new-password"')}${field('confirm','确认新密码','再次输入新密码','','password','required minlength="8" autocomplete="new-password"')}</div>${formFooter('确认修改')}</form>`,fd=>{if(fd.get('new')!==fd.get('confirm'))return modalError('两次输入的新密码不一致。');closeModal();toast('密码表单校验通过；原型不进行真实账号修改');});}
function logout(){showModal('欢迎回到栖居','高校宿舍管理系统 · 登录界面预览',`<form id="dialog-form" class="login-card"><div class="stack"><label class="field"><span>演示身份</span><select name="role">${Object.entries(roles).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}</select></label>${field('account','账号','输入任意演示账号','','text','required autocomplete="username"')}${field('password','密码','输入任意演示密码','','password','required autocomplete="current-password"')}</div><div class="note mt24">这是交互原型的登录预览，不验证真实账号。选择身份后可直接体验。</div>${formFooter('进入工作台')}</form>`,fd=>{ui.role=fd.get('role');closeModal();navigate('home');toast('已进入演示工作台');});}
function guide(){showModal('原型浏览说明','V0.1 · 灰蓝新拟态 · 无需联网',`<div class="stack"><p>右上角切换四种角色，左侧进入各工作区。所有姓名、寝室、工单与成绩均为模拟数据。</p><div class="note"><b>推荐体验顺序</b><br>1. 宿舍管理员：连续评分 → 统计排行 → 整改跟进。<br>2. 学生：新建报修 → 宿舍管理员派单 → 维修人员开始并完成 → 学生查看结果。<br>3. 系统管理员：住宿变更、成绩更正、批次状态及账号设置。</div><p class="small muted">页面变更只保留在当前打开的页面内；刷新或重置后恢复演示数据。真实登录、权限、数据库、服务端草稿及上传安全尚未实现。</p></div><div class="modal-actions">${btn('开始体验','close-modal','primary','arrow')}</div>`);}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action],[data-page],[data-tab],[data-housing-tab],[data-repair-status]');if(!el)return;if(el.disabled)return;if(el.dataset.page){navigate(el.dataset.page);return;}if(el.dataset.tab){ui.tab=el.dataset.tab;ui.query='';ui.status='all';render();return;}if(el.dataset.housingTab){ui.housingTab=el.dataset.housingTab;ui.query='';render();return;}if(el.dataset.repairStatus){ui.status=el.dataset.repairStatus;render();return;}e.preventDefault();let a=el.dataset.action,id=el.dataset.id,room=el.dataset.room;
switch(a){case'home':navigate('home');break;case'close-modal':closeModal();break;case'profile':profile();break;case'password':password();break;case'logout':logout();break;case'guide':guide();break;case'reset':showModal('重置演示数据','将清除本页面内的演示操作，恢复初始状态。',`<form id="dialog-form"><p>包括本次新增的工单、评分、草稿与住宿调整。</p>${formFooter('重置演示')}</form>`,()=>{resetState();initBeds();closeModal();navigate('home');toast('已恢复初始演示数据');});break;
case'start-score':navigate('hygiene',isAdmin()?'batch':'score');break;case'batch':navigate('hygiene','batch');break;case'ranking':navigate('hygiene','ranking');break;case'my-scores':navigate('hygiene','my-score');break;case'rectify':navigate('hygiene','rectify');break;case'repairs':navigate('repairs');break;case'audit':ui.housingTab='audit';navigate('residence');break;case'drafts':ui.room=Object.keys(state.drafts)[0]||ui.room;navigate('hygiene','score');break;
case'select-room':ui.room=room;if(ui.page!=='hygiene')ui.page='hygiene';ui.tab='score';render();break;case'save-draft':saveDraft();break;case'score-detail':detailScore(room);break;case'correct-score':correctScore(room);break;case'rect-detail':detailRect(room);break;case'repair-detail':detailRepair(id);break;case'new-repair':newRepair();break;case'assign-repair':assignRepair(id);break;case'start-repair':case'finish-repair':case'cancel-repair':changeRepair(id,a);break;case'room-detail':detailRoom(room);break;case'goto-students':closeModal();ui.housingTab='students';navigate('residence');break;case'student-detail':detailStudent(id);break;case'new-room':newRoom();break;case'new-account':newAccount();break;case'account-detail':detailAccount(Number(el.dataset.index));break;case'manage-batch':manageBatch();break;case'new-scheme':newScheme();break;case'batch-info':showModal('当前周检批次','2026-W46 · Asia/Shanghai',`<div class="stack"><p>检查周期：2026 年 11 月 09 日至 11 月 15 日</p><p>归属月份：2026 年 11 月（按周一归属）</p><p>评分标准：日常卫生检查 V${state.scheme}</p><p>管理状态：${state.batch}</p><div class="note">同一 ISO 年周只对应一个检查批次。检查日期与批次归属日分别记录。</div></div>`);break;}
});
document.addEventListener('change',async e=>{let t=e.target;if(t.id==='role'){ui.role=t.value;ui.housingTab='rooms';navigate('home');}else if(t.id==='building-filter'){ui.building=t.value;render();}else if(t.id==='score-status'||t.id==='rect-status'){ui.status=t.value;render();}else if(t.id==='period'){ui.period=t.value;render();}else if(t.id==='repair-images'){let files=[...t.files];if(files.length>5||files.some(f=>f.size>5*1024*1024||!['image/jpeg','image/png','image/webp'].includes(f.type))){t.value='';pendingImages=[];$('#image-previews').innerHTML='';modalError('仅支持 JPG、PNG、WebP；最多 5 张，每张不超过 5 MB。');return;}pendingImages=files.map(()=>null);let token=t;try{let images=await Promise.all(files.map(f=>new Promise((res,rej)=>{let rd=new FileReader();rd.onload=()=>{let img=new Image();img.onload=()=>res(rd.result);img.onerror=rej;img.src=rd.result;};rd.onerror=rej;rd.readAsDataURL(f);})));if($('#repair-images')!==token)return;pendingImages=images;$('#image-previews').innerHTML=images.map(src=>`<img src="${src}" alt="待提交的现场照片">`).join('');modalError('');}catch{if($('#repair-images')!==token)return;pendingImages=[];t.value='';$('#image-previews').innerHTML='';modalError('图片无法读取，请选择有效的图片文件。');}}});
document.addEventListener('input',e=>{let t=e.target;if(!['room-search','repair-search'].includes(t.id))return;let id=t.id,pos=t.selectionStart;ui.query=t.value;render();let input=$('#'+id);input.focus();input.setSelectionRange(pos,pos);});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){let r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
render();
</script>
</body>
</html>
